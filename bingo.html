<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bingo de orígenes de Stellaris." data-i18n-attr="content:bingoMetaDescription" />
    <title data-i18n="bingoPageTitle">Bingo · Codex Ignis</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/x-icon" href="img/Ignis Stellaris icon.png" />
  </head>
  <body>
    <main class="terminal-shell">
      <header class="topbar" aria-label="Cabecera del archivo">
        <div class="topbar-left">
          <a class="brand" href="./" aria-label="Codex Ignis: inicio"><span class="brand-mark" aria-hidden="true">✦</span><span>CODEX_IGNIS</span></a>
          <nav class="primary-nav" aria-label="Proyectos del archivo">
            <a href="bingo.html" aria-current="page">BINGO</a>
            <a href="planet-sim.html">PLANET_SIM</a>
          </nav>
        </div>
        <div class="lang-switch" role="group" aria-label="Selector de idioma">
          <button type="button" class="lang-btn" data-lang="es" aria-pressed="true">ES</button>
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
          <button type="button" class="lang-btn" data-lang="jp" aria-pressed="false">JP</button>
        </div>
      </header>

      <section class="terminal-intro">
        <h1 data-i18n="bingoHeading">Bingo</h1>
        <div class="intro-row">
          <p class="intro-copy" data-i18n="bingoInstructions">Haz clic en una casilla para marcarla como conseguida.</p>
          <div class="bingo-controls">
            <label class="bingo-type-label" for="bingo-type" data-i18n="bingoTypeLabel">Tipo de bingo</label>
            <select id="bingo-type" class="bingo-type-select">
              <option value="origins" data-i18n="bingoTypeOrigins">Orígenes</option>
              <option value="principles" data-i18n="bingoTypePrinciples">Principios</option>
            </select>
            <button type="button" id="bingo-download" class="bingo-download-btn" data-i18n="bingoDownloadButton">Descargar como imagen</button>
          </div>
        </div>
      </section>

      <section class="bingo-grid" id="bingo-grid" aria-label="Casillas del bingo"></section>
      <p class="bingo-empty-message" id="bingo-empty" data-i18n="bingoTypeEmpty" hidden>Todavía no hay principios cargados. Vuelve pronto.</p>

      <footer class="footer">
        <a href="./" data-i18n="backToCodexLink">Volver al codex</a>
      </footer>
    </main>
    <script type="module" src="js/bingo.js"></script>
  </body>
</html>
