<!doctype html>
<html lang="es" data-game-names>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bingo de orígenes de Stellaris." data-i18n-attr="content:bingoMetaDescription" />
    <title data-i18n="bingoPageTitle">Bingo · Codex Ignis</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/png" href="img/Ignis Stellaris icon.png" />
    <meta name="theme-color" content="#07110c" />
    <link rel="canonical" href="bingo" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Codex Ignis" />
    <meta property="og:title" content="Bingo · Codex Ignis" />
    <meta property="og:description" content="Bingo de orígenes de Stellaris." />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:image" content="img/Ignis Stellaris.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div class="terminal-shell">
      <header class="topbar" aria-label="Cabecera del archivo" data-i18n-attr="aria-label:a11yTopbarLabel">
        <div class="topbar-left">
          <a class="brand" href="./" aria-label="Codex Ignis: inicio" data-i18n-attr="aria-label:a11yHomeLink"><span class="brand-mark" aria-hidden="true">✦</span><span>CODEX_IGNIS</span></a>
          <nav class="primary-nav" aria-label="Proyectos del archivo" data-i18n-attr="aria-label:a11yProjectsNav">
            <a href="bingo.html" aria-current="page">BINGO</a>
            <a href="planet-sim.html">PLANET_SIM</a>
            <a href="tech-tree.html">TECH_TREE</a>
            <a href="testellaris.html">TESTELLARIS</a>
          </nav>
        </div>
        <div class="lang-switch" role="group" aria-label="Selector de idioma" data-i18n-attr="aria-label:a11yLangSwitch">
          <button type="button" class="lang-btn" data-lang="es" aria-pressed="true" aria-label="Español" lang="es">ES</button>
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="false" aria-label="English" lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="jp" aria-pressed="false" aria-label="日本語" lang="ja">JP</button>
        </div>
      </header>

      <main>
      <section class="terminal-intro">
        <h1 data-i18n="bingoHeading">Bingo</h1>
        <div class="intro-row">
          <p class="intro-copy" data-i18n="bingoInstructions">Haz clic en una casilla para marcarla como conseguida.</p>
          <div class="bingo-controls">
            <label class="bingo-type-label" for="bingo-type" data-i18n="bingoTypeLabel">Tipo de bingo</label>
            <!-- Options built by js/bingo.js from BINGOS (js/bingo-data.js). -->
            <select id="bingo-type" class="bingo-type-select"></select>
            <button type="button" id="bingo-download" class="bingo-download-btn" data-i18n="bingoDownloadButton">Descargar como imagen</button>
          </div>
        </div>
        <p class="bingo-description" id="bingo-description"></p>
        <p class="bingo-download-status" id="bingo-download-status" role="status"></p>
      </section>

      <section class="bingo-grid" id="bingo-grid" aria-label="Casillas del bingo" data-i18n-attr="aria-label:a11yBingoGrid"></section>
      <p class="bingo-empty-message" id="bingo-empty" data-i18n="bingoTypeEmpty" hidden>Todavía no hay principios cargados. Vuelve pronto.</p>
      </main>

      <footer class="footer">
        <a href="./" data-i18n="backToCodexLink">Volver al codex</a>
      </footer>
    </div>
    <script type="module" src="js/bingo.js"></script>
  </body>
</html>
