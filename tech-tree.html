<!doctype html>
<html lang="es" data-game-names>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Árbol de tecnología de Stellaris." data-i18n-attr="content:techTreeMetaDescription" />
    <title data-i18n="techTreePageTitle">Tech Tree · Codex Ignis</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/png" href="img/Ignis Stellaris icon.png" />
    <meta name="theme-color" content="#07110c" />
    <link rel="canonical" href="tech-tree" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Codex Ignis" />
    <meta property="og:title" content="Tech Tree · Codex Ignis" />
    <meta property="og:description" content="Árbol de tecnología de Stellaris." />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:image" content="img/Ignis Stellaris.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div class="terminal-shell">
      <header class="topbar" aria-label="Cabecera del archivo" data-i18n-attr="aria-label:a11yTopbarLabel">
        <div class="topbar-left">
          <a class="brand" href="./" aria-label="Codex Ignis: inicio" data-i18n-attr="aria-label:a11yHomeLink"><span class="brand-mark" aria-hidden="true">✦</span><span>CODEX_IGNIS</span></a>
          <nav class="primary-nav" aria-label="Proyectos del archivo" data-i18n-attr="aria-label:a11yProjectsNav">
            <a href="bingo.html">BINGO</a>
            <a href="planet-sim.html">PLANET_SIM</a>
            <a href="tech-tree.html" aria-current="page">TECH_TREE</a>
            <a href="testellaris.html">TESTELLARIS</a>
          </nav>
        </div>
        <div class="lang-switch" role="group" aria-label="Selector de idioma" data-i18n-attr="aria-label:a11yLangSwitch">
          <button type="button" class="lang-btn" data-lang="es" aria-pressed="true" aria-label="Español" lang="es">ES</button>
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="false" aria-label="English" lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="jp" aria-pressed="false" aria-label="日本語" lang="ja">JP</button>
          <select class="lang-select" aria-label="Otros idiomas del juego (interfaz en inglés)" data-i18n-attr="aria-label:a11yLangMore">
            <option value="" data-i18n="langMore">Más</option>
            <option value="pt" lang="pt-BR">Português (BR)</option>
            <option value="fr" lang="fr">Français</option>
            <option value="de" lang="de">Deutsch</option>
            <option value="ko" lang="ko">한국어</option>
            <option value="pl" lang="pl">Polski</option>
            <option value="ru" lang="ru">Русский</option>
            <option value="zh" lang="zh-Hans">简体中文</option>
          </select>
        </div>
      </header>

      <main>
      <section class="terminal-intro">
        <h1 data-i18n="techTreeHeading">Tech Tree</h1>
        <p class="intro-copy" data-i18n="techTreeIntro">Árbol de tecnología de Stellaris por área, campo y nivel, leído de los archivos del juego.</p>
        <div class="tech-version-bar">
          <label for="tech-version-select" data-i18n="techTreeVersionSelectLabel">Versión del juego</label>
          <select id="tech-version-select" class="tech-version-select"></select>
        </div>
        <p class="tech-version-warning" id="tech-version-warning" role="alert" hidden></p>
        <p class="tech-data-version" id="tech-data-version"></p>
        <ul class="tech-legend" id="tech-legend" aria-label="Leyenda" data-i18n-attr="aria-label:techTreeLegendLabel"></ul>
        <p class="tech-selection-status" id="tech-selection-status" role="status" aria-live="polite"></p>
      </section>

      <div class="tech-search" id="tech-search-box"></div>
      <div class="tech-zoom-bar" id="tech-zoom-bar"></div>

      <section class="tech-board" aria-labelledby="tech-board-heading">
        <h2 class="visually-hidden" id="tech-board-heading" data-i18n="techTreeBoardHeading">Áreas de investigación</h2>
        <nav class="tech-area-jumps" aria-label="Ir a un área" data-i18n-attr="aria-label:techTreeJumpLabel">
          <button type="button" class="tech-area-jump tech-area-jump--physics" id="tech-jump-physics" data-area="physics" aria-controls="tech-area-physics">Physics</button>
          <button type="button" class="tech-area-jump tech-area-jump--society" id="tech-jump-society" data-area="society" aria-controls="tech-area-society">Society</button>
          <button type="button" class="tech-area-jump tech-area-jump--engineering" id="tech-jump-engineering" data-area="engineering" aria-controls="tech-area-engineering">Engineering</button>
        </nav>
        <div class="tech-areas">
          <div class="tech-zoom">
            <div class="tech-stack">
              <section class="tech-area tech-area--physics" id="tech-area-physics" data-area="physics" aria-labelledby="tech-area-heading-physics">
                <h3 class="tech-area-heading" id="tech-area-heading-physics">Physics</h3>
                <div class="tech-area-body"></div>
              </section>
              <section class="tech-area tech-area--society" id="tech-area-society" data-area="society" aria-labelledby="tech-area-heading-society">
                <h3 class="tech-area-heading" id="tech-area-heading-society">Society</h3>
                <div class="tech-area-body"></div>
              </section>
              <section class="tech-area tech-area--engineering" id="tech-area-engineering" data-area="engineering" aria-labelledby="tech-area-heading-engineering">
                <h3 class="tech-area-heading" id="tech-area-heading-engineering">Engineering</h3>
                <div class="tech-area-body"></div>
              </section>
            </div>
          </div>
        </div>
        <aside class="tech-card" id="tech-card" aria-labelledby="tech-card-title" hidden></aside>
      </section>

      <section class="tech-compare" id="tech-compare" aria-labelledby="tech-compare-heading">
        <h2 class="panel-heading" id="tech-compare-heading" data-i18n="techTreeCompareHeading">Comparar versiones</h2>
        <div id="tech-compare-box"></div>
      </section>

      <section class="tech-credits" id="tech-credits" aria-labelledby="tech-credits-heading">
        <h2 class="panel-heading" id="tech-credits-heading" data-i18n="techTreeCreditsHeading">Créditos</h2>
        <p data-i18n="techTreeCreditsInspiration"></p>
        <p data-i18n="techTreeCreditsNoReuse"></p>
        <p data-i18n="techTreeCreditsGame"></p>
      </section>
      </main>

      <footer class="footer">
        <p data-i18n="techTreeFooterCredit"></p>
        <nav aria-label="Enlaces del pie" data-i18n-attr="aria-label:techTreeFooterNav">
          <a href="#tech-credits" data-i18n="techTreeCreditsHeading">Créditos</a>
          <a href="./" data-i18n="backToCodexLink">Volver al codex</a>
        </nav>
      </footer>
    </div>
    <script type="module" src="js/tech-tree.js"></script>
  </body>
</html>
